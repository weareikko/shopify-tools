name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, prepatch, preminor, premajor, prerelease, or an exact version (e.g. 0.1.0, 1.0.0-beta.0)"
        type: string
        required: true
        default: patch
      preid:
        description: "Prerelease identifier, used by prepatch, preminor, premajor and prerelease"
        type: choice
        options: [beta, alpha, rc]
        default: beta

concurrency: release

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

  release:
    name: Bump version and changelog
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog action reads the commit that added each fragment.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Bumps the root and every workspace package, and updates the lock file.
      # --allow-same-version lets the first release keep the current 0.1.0.
      - name: Bump version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          PREID: ${{ inputs.preid }}
        run: |
          npm version "$VERSION_INPUT" --preid "$PREID" --no-git-tag-version --workspaces --include-workspace-root --allow-same-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Fold changelog fragments
        id: changelog
        uses: weareikko/changelog@cb24219df8d46e3549a6fe5c10e06f9b01e5011e # 1.0.1
        with:
          command: release
          version: ${{ steps.version.outputs.version }}

      - name: Fail when there is nothing to release
        if: steps.changelog.outputs.changed != 'true'
        run: |
          echo "::error::No fragment in .changelog/: nothing to release."
          exit 1

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changelog package.json package-lock.json packages/*/package.json
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main "$VERSION"

  # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
  # release publishes in the same run.
  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determine npm tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          NPM_TAG='latest'
          IS_PRERELEASE=false

          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            NPM_TAG='next'
            IS_PRERELEASE=true
          fi

          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

      - name: Publish @ikko-dev/shopify-mcp
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.release.outputs.version }}
          name: ${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.body }}
          prerelease: ${{ env.IS_PRERELEASE }}
